name: Deploy Static Registry & Publish Release Assets

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install OKF CLI
        run: go install github.com/okf-memory/okf-agent-memory/cmd/okf@latest

      - name: Crawl & Validate Community Bundles
        id: crawl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/crawl

      - name: Commit Updated Community Bundles
        if: steps.crawl.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/community.json data/cache_etags.json
          git commit -m "chore(community): update indexed bundles [skip ci]" || true
          git push origin main || true

      - name: Check Deploy Condition
        id: check_deploy
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.crawl.outputs.changed }}" != "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping build and deploy: scheduled run with no new or updated community bundles."
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Proceeding with build and deploy."
          fi

      - name: Validate Official Core Bundles (Graph Health & Drift)
        if: steps.check_deploy.outputs.should_deploy == 'true'
        run: |
          for d in bundles/*; do
            if [ -d "$d" ]; then
              okf validate "$d" --strict --drift
            fi
          done

      - name: Monitor Staleness Horizons (30-Day Alert)
        if: steps.check_deploy.outputs.should_deploy == 'true'
        run: |
          for d in bundles/*; do
            if [ -d "$d" ]; then
              okf validate "$d" --stale-within 30d || true
            fi
          done

      - name: Build Static Registry
        if: steps.check_deploy.outputs.should_deploy == 'true'
        run: go run ./scripts/build

      - name: Publish Immutable GitHub Releases
        if: steps.check_deploy.outputs.should_deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./scripts/publish

      - name: Setup Pages
        if: steps.check_deploy.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.check_deploy.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        if: steps.check_deploy.outputs.should_deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
